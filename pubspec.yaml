name: mcp_form
description: Form document creation, validation, rendering, and management for the MCP ecosystem.
version: 0.2.2
homepage: https://app-appplayer.github.io/makemind
repository: https://github.com/app-appplayer/mcp_form
issue_tracker: https://github.com/app-appplayer/mcp_form/issues

topics:
  - form
  - mcp
  - ai
  - dart
  - document

environment:
  sdk: ^3.0.0

dependencies:
  collection: ^1.19.1
  image: ^4.3.0 # decode PNG / GIF / WebP for PDF embedding (JPEG passes through); 4.9+ needs archive 4, mcp_bundle is on archive 3
  mcp_bundle: ^0.4.10
  meta: ^1.18.0 # latest the Flutter SDK pins (3.44: meta 1.18.0); 1.19 would not resolve for Flutter consumers

dev_dependencies:
  lints: ^3.0.0
  mockito: ^5.4.0
  test: ^1.24.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
